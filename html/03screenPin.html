<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gsap基础学习</title>
  </head>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

  <style>
    body,
    html {
      margin: 0;
      padding: 0;
    }

    header,
    footer {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .animaiton-area {
      position: relative;
      width: 100%;
      height: 100vh; /* 保证足够滚动空间 */
    }

    .panel {
      height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .panel1 {
      position: absolute;
      top: 0;
      left: 0;
      background: #ff6b6b;
      z-index: 1;
    }
    .panel2 {
      position: absolute;
      top: 0;
      left: 0;
      background: #4ecdc4;
    }
  </style>
  <body>
    <header>header</header>
    <div class="animaiton-area">
      <section class="panel panel1">第一屏</section>
      <section class="panel panel2">第二屏</section>
    </div>
    <footer>footer</footer>
  </body>
  <script>
    gsap.registerPlugin(ScrollTrigger);

    // 初始化所有面板动画

    const tl = gsap.timeline({
      scrollTrigger: {
        trigger: ".animaiton-area",
        start: "top top", // 当面板顶部接触视口顶部时触发
        end: "bottom top", // 滚动200%视口高度后结束
        pin: true, // 固定当前面板
        scrub: 1, // 平滑跟随滚动（1秒缓冲）
        anticipatePin: 1, // 预判固定位置
        markers: true, // 调试标记
      },
    });

    // 同时执行两个面板的透明度变化
    tl.fromTo(
      ".panel1",
      {
        opacity: 1,
      },
      {
        opacity: 0,
      }
    ).fromTo(
      ".panel2",
      {
        opacity: 0,
      },
      {
        opacity: 1,
      },
      "<1"
    );

    // gsap.set(".panel2", { opacity: 0 });
  </script>
</html>
