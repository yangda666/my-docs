<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    header,
    footer {
      height: 100vh;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid purple;
    }
    .animation-area {
      display: flex;
      gap: 50px;
      /* overflow-y: hidden; */
    }
    .panel {
      width: 500px;
      height: 400px;
      display: flex;
      flex-shrink: 0;
      justify-content: center;
      align-items: center;
    }
    .panel1 {
      margin-left: calc(100% - 600px);
      background: skyblue;
    }
    .panel2 {
      background: red;
    }
    .panel3 {
      background: palegreen;
    }
  </style>
  <body>
    <header>header</header>

    <div class="animation-area">
      <div class="panel panel1"></div>
      <div class="panel panel2"></div>
      <div class="panel panel3"></div>
    </div>

    <footer>footer</footer>
  </body>
  <script>
    const del = document.querySelector(".animation-area").clientWidth;

    console.log("del", del);

    gsap.registerPlugin(ScrollTrigger);

    // 初始化所有面板动画
    // 为每个面板设置滚动动画
    // gsap.to(".panel", {
    //   x: -1500, // 向左移动500px
    //   scrollTrigger: {
    //     trigger: ".animation-area",
    //     start: "top top", // 当动画区域顶部到达视口顶部时开始
    //     end: "bottom top", // 当动画区域底部到达视口顶部时结束
    //     scrub: true, // 平滑滚动
    //     pin: true,
    //     markers: true, // 显示调试标记
    //   },
    // });

    const tl = gsap.timeline({
      scrollTrigger: {
        trigger: ".animation-area",
        start: "top top", // 当面板顶部接触视口顶部时触发
        end: "bottom top", // 滚动200%视口高度后结束
        pin: true, // 固定当前面板
        scrub: 1, // 平滑跟随滚动（1秒缓冲）
        markers: true, // 调试标记
      },
    });

    // // // 同时执行两个面板的透明度变化
    tl.to(".animation-area", {
      x: -1500,
    });

    // gsap.set(".panel2", { opacity: 0 });
  </script>
</html>
