<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gsap基础学习</title>
  </head>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html {
      width: 100%;
    }
    body {
      width: 100%;
    }
    main {
      width: 100%;
    }
    .animaiton-area {
      width: 100%;
      height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .spacer {
      width: 100%;
      height: 50vh;
      background-color: #222;
    }
    .block {
      width: 100%;
      height: 300px;
      background-color: #222;
    }
    .animaiton-area img {
      max-height: 95vh;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      -webkit-transform: translate(-50%, -50%);
      -ms-transform: translate(-50%, -50%);
    }
    .headline {
      font-size: 20px;
      display: inline-block;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      background-image: linear-gradient(90deg, #2e1f7c, #6652e1);

      will-change: transform;
      padding-top: 0.5px;
      overflow: hidden;
    }
  </style>
  <body>
    <section class="spacer"></section>
    <section class="animaiton-area">
      <h2 class="headline">
        Lorem ipsum<br />
        dolor sit<br />
        consectetur<br />
        adipiscing <br />
        Retina<br />
        elit<br />
        eiusmod <br />
        incididunt <br />
        dolore
      </h2>
      <img
        src="https://ryo-sukeblog.net/wp-content/uploads/2022/05/mockup01.png"
        class="img01"
      />
      <img
        src="https://ryo-sukeblog.net/wp-content/uploads/2022/05/mockup02.png"
        class="img02"
      />
      <img
        src="https://ryo-sukeblog.net/wp-content/uploads/2022/05/mockup03.png"
        class="img03"
      />
    </section>
    <seciton class="spacer">
      <!-- <div class="block"></div> -->
    </seciton>
  </body>
  <script>
    // 创建gsap 时间线
    const tl = gsap.timeline({
      scrollTrigger: {
        trigger: ".animaiton-area",
        start: "top center",
        end: "bottom center",
        markers: true, // 显示标记
        pin: true, // 固定元素
        scrub: true, // 滚动时动画
        toggleActions: "play none none reverse",
      },
    });
    tl.to(".headline", { x: "150px" }, "<")
      .to(".img03", { x: "-100%", scale: 0.95 }, "<")
      .to(".img02", { x: "-200%", scale: 0.9 }, "<")
      .to(".img01", { x: "-300%", scale: 0.85 }, "<")
      .fromTo();
  </script>
</html>
